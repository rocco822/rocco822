name: Update music and films cards

on:
  schedule:
    - cron: "37 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, music.txt, scripts/**, .github/workflows/music.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Draw record
        env:
          # Settings → Secrets and variables → Actions → Secrets.
          # Without the key it falls back to music.txt.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: rocpan
        run: python3 scripts/music.py

      - name: Draw films
        env:
          LETTERBOXD_USER: roccopanizzi
        run: python3 scripts/films.py

      - name: Version image URLs
        run: python3 scripts/bust.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update music and films cards"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 20))
          done
          exit 1
